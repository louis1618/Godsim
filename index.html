<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Godsim</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0b1c; }
    #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; outline: none; }
    #boot { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 45%, #2f2752 0%, #17122b 60%, #0e0b1c 100%); z-index: 50; display: flex; align-items: center; justify-content: center; flex-direction: column; transition: opacity 1.2s ease, transform 1.4s cubic-bezier(.6,0,.3,1); }
    #boot.hide { opacity: 0; transform: scale(1.6); pointer-events: none; }
    #boot .seed { width: 120px; height: 120px; position: relative; }
    #boot .core { position: absolute; inset: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff8d0, #ffcf3a 40%, #e07a1a 100%); box-shadow: 0 0 40px #ffb83a, 0 0 90px rgba(255,160,60,.5); animation: gs-pulse 1.6s ease-in-out infinite; }
    #boot .orbit { position: absolute; inset: 0; border: 3px solid rgba(255,220,140,.35); border-radius: 50%; animation: gs-spin 3s linear infinite; }
    #boot .orbit::before { content: ''; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #9fe8ff; top: -8px; left: 50%; margin-left: -7px; box-shadow: 0 0 14px #9fe8ff; }
    #boot .bar { margin-top: 34px; width: 220px; height: 10px; border-radius: 6px; background: rgba(255,255,255,.08); overflow: hidden; border: 2px solid rgba(255,220,140,.25); }
    #boot .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffcf3a, #fff2b0); width: 0; transition: width .25s; }
    @keyframes gs-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @keyframes gs-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <div id="ui"></div>
  <div id="boot"><div class="seed"><div class="orbit"></div><div class="core"></div></div><div class="bar"><i></i></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
